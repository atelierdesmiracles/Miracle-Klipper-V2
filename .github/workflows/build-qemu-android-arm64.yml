name: Build QEMU Android ARM64 package

on:
  workflow_dispatch:
  push:
    branches:
      - rewrite/miracle-klipper-v2
    paths:
      - '.github/workflows/build-qemu-android-arm64.yml'
      - 'v2/runtime/qemu/**'
      - 'scripts/verify-qemu-source.sh'
      - 'scripts/prepare-qemu-headless-recipe.sh'
      - 'scripts/build-alpine-guest.sh'
      - 'scripts/assemble-runtime-bundle.sh'
      - 'v2/runtime/klipper/**'

permissions:
  contents: read

jobs:
  build-qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Miracle Klipper V2
        uses: actions/checkout@v4

      - name: Verify Docker availability
        run: docker version

      - name: Checkout pinned Termux package builder
        env:
          TERMUX_PACKAGES_COMMIT: 0e1306a2df4492ce5113fe220b65c4c4a4bf6e2d
        run: |
          git clone --filter=blob:none https://github.com/termux/termux-packages.git termux-packages
          git -C termux-packages checkout "$TERMUX_PACKAGES_COMMIT"
          test "$(git -C termux-packages rev-parse HEAD)" = "$TERMUX_PACKAGES_COMMIT"

      - name: Prepare minimal headless QEMU recipe
        run: |
          bash scripts/prepare-qemu-headless-recipe.sh termux-packages/x11-packages/qemu-system-x86-64/build.sh

      - name: Build headless QEMU AArch64 package
        working-directory: termux-packages
        run: |
          chmod +x scripts/run-docker.sh build-package.sh
          mkdir -p ../qemu-output
          ./scripts/run-docker.sh ./build-package.sh -f -I qemu-system-x86-64
          docker image inspect ghcr.io/termux/package-builder --format '{{.Id}}' > ../qemu-output/builder-image-id.txt
          docker image inspect ghcr.io/termux/package-builder --format '{{join .RepoDigests "\n"}}' > ../qemu-output/builder-image-digests.txt
          git rev-parse HEAD > ../qemu-output/termux-packages-commit.txt

      - name: Collect and normalize QEMU package outputs
        if: always()
        run: |
          mkdir -p qemu-output
          if [ -d termux-packages/output ]; then
            while IFS= read -r -d '' package; do
              filename="$(basename "$package" | tr ':' '_')"
              cp "$package" "qemu-output/$filename"
            done < <(find termux-packages/output -type f \\( -name '*.deb' -o -name '*.tar.xz' \\) -print0)
          fi
          if [ -n "$(find qemu-output -type f ! -name 'SHA256SUMS' -print -quit)" ]; then
            (cd qemu-output && sha256sum * > SHA256SUMS)
          fi

      - name: Audit Android QEMU ELF package
        if: success()
        run: |
          package=""
          for candidate in qemu-output/*.deb; do
            [ -f "$candidate" ] || continue
            if dpkg-deb -c "$candidate" | grep -q '/qemu-system-aarch64$'; then package="$candidate"; break; fi
          done
          test -n "$package"
          bash scripts/audit-qemu-android-package.sh "$package"

      - name: Install runtime bundle build tools
        if: success()
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support e2fsprogs qemu-utils patchelf zip
          sudo update-binfmts --enable qemu-aarch64

      - name: Build Alpine ARM64 guest
        if: success()
        run: sudo bash scripts/build-alpine-guest.sh "$RUNNER_TEMP/alpine-guest"

      - name: Assemble complete Android runtime bundle
        if: success()
        run: bash scripts/assemble-runtime-bundle.sh qemu-output "$RUNNER_TEMP/alpine-guest" runtime-output

      - name: Upload complete Miracle Klipper runtime bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: miracle-klipper-v2-runtime-alpine-arm64
          path: runtime-output/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload QEMU package artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miracle-klipper-qemu-headless-arm64-packages
          path: qemu-output/*
          if-no-files-found: warn
          retention-days: 14
