name: Publish Miracle Klipper V2 runtime release

on:
  workflow_run:
    workflows:
      - Build QEMU Android ARM64 package
    types:
      - completed
    branches:
      - rewrite/miracle-klipper-v2

permissions:
  actions: read
  contents: write

jobs:
  publish-runtime:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'rewrite/miracle-klipper-v2' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download verified runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: miracle-klipper-v2-runtime-alpine-arm64
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          archive="release-assets/miracle-klipper-runtime-alpine-3.24.3-arm64.zip"
          checksum="$archive.sha256"
          test -s "$archive"
          test -s "$checksum"
          (cd release-assets && sha256sum -c "$(basename "$checksum")")
          unzip -t "$archive" | tail -n 2

      - name: Publish stable runtime download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: miracle-klipper-runtime-latest
          name: Miracle Klipper V2 — Runtime ARM64 (latest)
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/miracle-klipper-runtime-alpine-3.24.3-arm64.zip
            release-assets/miracle-klipper-runtime-alpine-3.24.3-arm64.zip.sha256
